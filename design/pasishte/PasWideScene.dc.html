class Component extends DCLogic {
  tally(t) {
    t = t || { b: 2, c: 1 };
    const arr = [];
    for (let i = 0; i < t.b; i++) arr.push({ isBull: true });
    for (let i = 0; i < t.c; i++) arr.push({ isCow: true });
    if (!arr.length) arr.push({ isNone: true });
    const w = 22, x0 = -((arr.length - 1) * w) / 2;
    return arr.map((a, i) => Object.assign(a, { tf: 'translate(' + (x0 + i * w) + ' -21)' }));
  }
  renderVals() {
    const p = this.props;
    const idle = [
      { isBull: true, tf: 'translate(300 600) scale(1.9)', cls: 'a-idle', d: '0s' },
      { isBull: true, tf: 'translate(535 575) scale(1.55)', cls: 'a-idle', d: '-1.3s' },

      { isCow: true, tf: 'translate(1060 650) scale(1.9)', cls: 'a-idle', d: '-1s' }
    ];
    const par = Number(p.parity) || 0;
    return {
      vb: p.vb || '0 0 1600 900', fog: p.fog != null ? p.fog : 0, sunY: p.sunY != null ? p.sunY : 150, dawn: p.dawn != null ? p.dawn : 0.1,

    };

}
