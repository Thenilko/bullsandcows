name: CI

on:
  pull_request:
  push:
    branches: [main, 'feat/**']

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      # Workers pool (server) cannot collect v8 coverage, so it runs separately.
      - name: Test server (Workers pool)
        run: pnpm exec vitest run --project server
      - name: Test with coverage (game-core >= 95%, workspace >= 80% statements)
        run: pnpm test:coverage
      - name: Upload coverage summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-summary
          path: coverage/coverage-summary.json
          if-no-files-found: ignore
          retention-days: 7

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build web (fake auth) and dry-run the Worker bundle
        env:
          VITE_AUTH_MODE: fake
        run: pnpm build

  e2e:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Chromium
        working-directory: apps/web
        run: pnpm exec playwright install --with-deps chromium
      # `pnpm e2e` locally; split in two jobs here so each stays well inside the timeout.
      - name: Build web (fake auth) for the local Worker assets
        run: pnpm --filter web build
        env:
          VITE_AUTH_MODE: fake
      - name: Run Playwright flows (fake auth, memory repo, no secrets)
        run: pnpm --filter web exec playwright test --project=mobile --project=desktop
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          if-no-files-found: ignore
          retention-days: 7

  e2e-gallery:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Chromium
        working-directory: apps/web
        run: pnpm exec playwright install --with-deps chromium
      # Screenshot baselines are rendered on macOS, so CI runs axe over the gallery but skips the
      # pixel comparison (playwright.config.ts: ignoreSnapshots). CI_SCREENSHOTS=1 turns it on.
      - name: Build web (fake auth) for the local Worker assets
        run: pnpm --filter web build
        env:
          VITE_AUTH_MODE: fake
      - name: Run Playwright gallery (axe; screenshots only with CI_SCREENSHOTS=1)
        run: pnpm --filter web exec playwright test --project=gallery
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-gallery
          path: |
            apps/web/playwright-report
            apps/web/test-results
          if-no-files-found: ignore
          retention-days: 7
