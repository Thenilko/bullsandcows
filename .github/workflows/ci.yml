name: CI

on:
  pull_request:
  push:
    branches: [main, 'feat/**']

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      # Workers pool (server) cannot collect v8 coverage, so it runs separately.
      - name: Test server (Workers pool)
        run: pnpm exec vitest run --project server
      - name: Test with coverage (game-core >= 95%, workspace >= 80% statements)
        run: pnpm test:coverage
      - name: Upload coverage summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-summary
          path: coverage/coverage-summary.json
          if-no-files-found: ignore
          retention-days: 7

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build web (fake auth) and dry-run the Worker bundle
        env:
          VITE_AUTH_MODE: fake
        run: pnpm build

  # The Playwright jobs build their own client, so they do not wait for `build`. Chromium is cached by version.
  e2e:
    name: e2e (${{ matrix.project }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # One job per project, each with its own Worker: the flows stay sequential inside a job (quick duels pair
        # through the shared queue), but the phone and the desktop run side by side.
        project: [mobile, desktop]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Cache Chromium
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install Chromium
        working-directory: apps/web
        run: |
          if [ "${{ steps.pw-cache.outputs.cache-hit }}" = "true" ]; then
            pnpm exec playwright install-deps chromium
          else
            pnpm exec playwright install --with-deps chromium
          fi
      - name: Build web (fake auth) for the local Worker assets
        run: pnpm --filter web build
        env:
          VITE_AUTH_MODE: fake
      - name: Run Playwright flows (fake auth, memory repo, no secrets)
        run: pnpm --filter web exec playwright test --project=${{ matrix.project }}
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.project }}
          path: |
            apps/web/playwright-report
            apps/web/test-results
          if-no-files-found: ignore
          retention-days: 7

  e2e-gallery:
    name: e2e-gallery (${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # axe on every screen is CPU-bound on the 2-core runner: three machines, not more workers on one.
        shard: [1/3, 2/3, 3/3]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Cache Chromium
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install Chromium
        working-directory: apps/web
        run: |
          if [ "${{ steps.pw-cache.outputs.cache-hit }}" = "true" ]; then
            pnpm exec playwright install-deps chromium
          else
            pnpm exec playwright install --with-deps chromium
          fi
      # Screenshot baselines are rendered on macOS, so CI runs axe and the layout checks over the gallery but not
      # the pixel tests (screens.spec.ts: PIXELS). CI_SCREENSHOTS=1 turns them on.
      - name: Build web (fake auth) for the local Worker assets
        run: pnpm --filter web build
        env:
          VITE_AUTH_MODE: fake
      # The gallery screens are independent page loads of a static build, so they run on two workers.
      - name: Run Playwright gallery (axe and layout; screenshots only with CI_SCREENSHOTS=1)
        run: pnpm --filter web exec playwright test --project=gallery --workers=2 --shard=${{ matrix.shard }}
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-gallery-${{ strategy.job-index }}
          path: |
            apps/web/playwright-report
            apps/web/test-results
          if-no-files-found: ignore
          retention-days: 7
