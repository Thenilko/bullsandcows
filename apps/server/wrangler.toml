# One Worker: SPA static assets + /api (Hono) + /ws (Durable Objects).
name = "pasishte"
# The game's own address; pasishte.danailsimeonov89.workers.dev keeps working too.
routes = [{ pattern = "bullsandcows.nilkospace.app", custom_domain = true }]
workers_dev = true
main = "src/index.ts"
compatibility_date = "2026-09-01"
# postgres.js needs the Node compatibility layer (net/tls shims over Workers sockets).
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "../web/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/ws/*", "/assets/*"]

[[durable_objects.bindings]]
name = "QUEUE"
class_name = "QueueRoom"

[[durable_objects.bindings]]
name = "DUEL"
class_name = "DuelRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["QueueRoom", "DuelRoom"]

# Daily keep-alive query so the free Supabase project is not paused; the weekly challenge is finalised at
# Monday 00:01 Sofia, which is 21:01 UTC (summer time) or 22:01 UTC (winter time) on Sunday — both run, the
# finalisation is idempotent per week.
[triggers]
crons = ["0 6 * * *", "1 21 * * SUN", "1 22 * * SUN"]

[[hyperdrive]]
binding = "HYPERDRIVE"
id = "6660123b9e744a6db01bf27c1924a467"

[vars]
AUTH_MODE = "supabase"
REPO_MODE = "postgres"
ENVIRONMENT = "production"
APP_ORIGIN = "https://bullsandcows.nilkospace.app"

# Local development: fake auth + in-memory repo.
# Durable Object bindings and vars are not inherited by environments.
[env.dev]
[[env.dev.durable_objects.bindings]]
name = "QUEUE"
class_name = "QueueRoom"

[[env.dev.durable_objects.bindings]]
name = "DUEL"
class_name = "DuelRoom"

# Dev uses the memory repo; this binding only exists so that switching REPO_MODE to
# "postgres" locally talks to a local Supabase (`supabase start`, port 54322).
[[env.dev.hyperdrive]]
binding = "HYPERDRIVE"
id = "REPLACE_ME"
localConnectionString = "postgres://postgres:postgres@127.0.0.1:54322/postgres"

[env.dev.vars]
AUTH_MODE = "fake"
REPO_MODE = "memory"
ENVIRONMENT = "dev"
APP_ORIGIN = "http://127.0.0.1:5173"
